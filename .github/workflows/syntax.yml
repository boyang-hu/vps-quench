name: Syntax check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  bash-syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Check shell syntax
        run: bash -n vps-quench.sh build-offline-package.sh tests/offline-package.sh

      - name: Verify generated release
        run: ./build.sh --check

      - name: Run ShellCheck
        # info 级也纳入门禁。SC2015 是唯一例外：仓库里剩余 67 处都是
        # `cmd && next || cleanup` 这类“失败即清理”惯用法，已逐条审计为良性；
        # 会导致恢复失败反而删掉配置的危险变体已经修复并有回归测试覆盖。
        run: shellcheck --severity=info --exclude=SC2015 -x vps-quench.sh build-offline-package.sh tests/offline-package.sh

      - name: Verify release checksum
        run: sha256sum -c vps-quench.sh.sha256

      - name: Run smoke tests
        run: tests/smoke.sh

      - name: Run fault injection tests
        run: tests/fault-injection.sh

      - name: Test offline package
        run: tests/offline-package.sh
