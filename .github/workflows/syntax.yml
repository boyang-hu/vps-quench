name: Syntax check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  bash-syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Check shell syntax
        run: bash -n vps-quench.sh build-offline-package.sh tests/offline-package.sh

      - name: Verify generated release
        run: ./build.sh --check

      - name: Run ShellCheck
        # info 级全量门禁，不再全局排除 SC2015：那正是「恢复失败反而删配置」
        # 所属的规则，全局排除等于以后同类错误也不会报警。现存的每一处都改成
        # 了带理由的行级 suppression，新写的同类代码仍会被拦下。
        run: shellcheck --severity=info -x vps-quench.sh build-offline-package.sh tests/offline-package.sh tests/lib/harness.sh

      - name: Verify release checksum
        run: sha256sum -c vps-quench.sh.sha256

      - name: Run smoke tests
        run: tests/smoke.sh

      - name: Run fault injection tests
        run: tests/fault-injection.sh

      - name: Test offline package
        run: tests/offline-package.sh
