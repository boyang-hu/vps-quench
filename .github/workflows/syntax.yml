name: Syntax check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  bash-syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Check shell syntax
        run: |
          for script in vps-quench.sh build-offline-package.sh tests/offline-package.sh \
            tests/fail2ban-shared.sh tests/fail2ban-shared-integration.sh; do
            bash -n "$script"
          done

      - name: Verify generated release
        run: ./build.sh --check

      - name: Run ShellCheck
        # info 级全量门禁，不再全局排除 SC2015：那正是「恢复失败反而删配置」
        # 所属的规则，全局排除等于以后同类错误也不会报警。现存的每一处都改成
        # 了带理由的行级 suppression，新写的同类代码仍会被拦下。
        #
        # 版本必须钉死：SC2015 的判定范围逐版本在收窄，runner 自带的版本比本地
        # 新一点或旧一点，命中集合就不同，行级 suppression 会跟着对不上。
        run: |
          docker run --rm -v "$PWD:/mnt" -w /mnt koalaman/shellcheck:v0.11.0 --version
          docker run --rm -v "$PWD:/mnt" -w /mnt koalaman/shellcheck:v0.11.0 \
            --severity=info -x \
            vps-quench.sh build-offline-package.sh tests/offline-package.sh tests/lib/harness.sh

      - name: Verify release checksum
        run: sha256sum -c vps-quench.sh.sha256

      - name: Run smoke tests
        run: tests/smoke.sh

      - name: Run fault injection tests
        run: tests/fault-injection.sh

      - name: Test Fail2ban and 1Panel shared configuration
        run: bash tests/fail2ban-shared.sh

      - name: Install real Fail2ban test dependency
        run: sudo apt-get update && sudo apt-get install -y fail2ban

      - name: Test isolated real Fail2ban parser and runtime
        run: sudo bash tests/fail2ban-shared-integration.sh

      - name: Test offline package
        run: tests/offline-package.sh
