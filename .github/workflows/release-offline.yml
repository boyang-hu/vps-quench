name: Publish offline package

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate release tag
        run: |
          version=$(sed -nE 's/^APP_VERSION="(V[0-9]+\.[0-9]+(\.[0-9]+)?)".*/\1/p' vps-quench.sh | head -1)
          expected="v${version#V}"
          if [ "$GITHUB_REF_NAME" != "$expected" ]; then
            echo "Tag $GITHUB_REF_NAME does not match script version $version" >&2
            exit 1
          fi

      - name: Validate scripts
        run: |
          bash -n vps-quench.sh build-offline-package.sh tests/offline-package.sh
          ./build.sh --check
          shellcheck --severity=warning -x vps-quench.sh build-offline-package.sh tests/offline-package.sh
          sha256sum -c vps-quench.sh.sha256
          tests/smoke.sh
          tests/fault-injection.sh
          tests/offline-package.sh

      - name: Build release assets
        run: ./build-offline-package.sh

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -nE 's/^APP_VERSION="(V[0-9]+\.[0-9]+(\.[0-9]+)?)".*/\1/p' vps-quench.sh | head -1)
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --title "Quench $version"
            while IFS= read -r asset; do
              [ -z "$asset" ] || gh release delete-asset "$GITHUB_REF_NAME" "$asset" --yes
            done < <(gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name')
            gh release upload "$GITHUB_REF_NAME" dist/* vps-quench.sh vps-quench.sh.sha256
          else
            gh release create "$GITHUB_REF_NAME" \
              dist/* vps-quench.sh vps-quench.sh.sha256 \
              --title "Quench $version" \
              --notes "完整脚本与离线安装包。离线包内含独立安装器和 SHA256 校验，适合下载后传入无法访问 GitHub 的 VPS。"
          fi
